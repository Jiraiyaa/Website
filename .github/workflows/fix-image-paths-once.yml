name: Fix image paths once

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-image-paths:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Replace .webp image paths with .png
        run: |
          perl -0pi -e 's/\.webp/\.png/g' index.html
          rm -f .github/workflows/fix-image-paths-once.yml

      - name: Commit fixed paths
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-image-paths-once.yml
          git commit -m "Fix image paths for GitHub Pages"
          git push
